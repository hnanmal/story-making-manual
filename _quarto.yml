format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 5
    number-sections: true
    code-copy: true
    lightbox: true
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true
    link-external-icon: true
    mermaid:
      theme: default

  pdf:
    pdf-engine: xelatex
    mainfont: "Malgun Gothic"
    sansfont: "Malgun Gothic"
    monofont: "Malgun Gothic"

  docx:
    toc: true
    number-sections: true

lang: ko-KR

execute:
  freeze: auto